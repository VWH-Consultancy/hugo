baseurl = "https://vwh-consultancy.github.io/hugo/"
languageCode = "en-us"
title = "VWH Consultancy"
theme = "terminal"
pagination.pagerSize = 5

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[params]
  contentTypeName = "posts"
  showMenuItems = 2
  fullWidthTheme = false
  centerTheme = false
  showLanguageSelector = false
  autoCover = true
  showLastUpdated = false
  readingTime = false

[languages]
  [languages.en]
    title = "VWH Consultancy"
    subtitle = "Professional consulting services"
    keywords = ""
    copyright = "© 2025 VWH Consultancy. All rights reserved."
    menuMore = "Show more"
    readMore = "Read more"
    readOtherPosts = "Read other posts"

    [languages.en.params.logo]
      logoText = "VWH"
      logoHomeLink = "/"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about"
      [[languages.en.menu.main]]
        identifier = "services"
        name = "Services"
        url = "/services"
      [[languages.en.menu.main]]
        identifier = "contact"
        name = "Contact"
        url = "/contact"